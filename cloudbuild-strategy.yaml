steps:
  # 1. Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/stockaibot/strategy-engine:$COMMIT_SHA', '-f', 'Dockerfile.strategy', '.']

  # 2. Push the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/stockaibot/strategy-engine:$COMMIT_SHA']

  # 3. Deploy to Cloud Run Jobs
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'deploy'
      - 'strategy-engine-job'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/stockaibot/strategy-engine:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--tasks'
      - '1'
      - '--max-retries'
      - '0'
      - '--task-timeout'
      - '60m'
      - '--set-env-vars'
      - 'PROJECT_ID=$PROJECT_ID'

  # 4. Execute the Cloud Run Job
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'execute'
      - 'strategy-engine-job'
      - '--region'
      - 'us-central1'
      - '--wait'  # Wait for completion (optional, but good for build logs)


images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/stockaibot/strategy-engine:$COMMIT_SHA'

options:
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
